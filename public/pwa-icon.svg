      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" fill="url(#bg-grad)" rx="112"/>
  
  <!-- Circuit Nodes -->
  <circle cx="128" cy="128" r="16" fill="url(#accent-grad)"/>
  <circle cx="384" cy="128" r="16" fill="url(#accent-grad)"/>
  <circle cx="128" cy="384" r="16" fill="url(#accent-grad)"/>
  <circle cx="384" cy="384" r="16" fill="url(#accent-grad)"/>
  
